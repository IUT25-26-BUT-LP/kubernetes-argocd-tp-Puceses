name: CI/CD Security Pipeline

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Scan Trivy - BLOQUE si vulnérabilité CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:latest
          format: table
          exit-code: 1
          severity: CRITICAL
          
      - name: Image validée - déploiement autorisé
        run: echo "Image sûre - ArgoCD peut déployer"
