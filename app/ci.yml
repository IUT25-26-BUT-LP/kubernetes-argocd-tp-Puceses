name: CI/CD Security Pipeline

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build image Docker
        run: |
          docker build -t nginx-app:${{ github.sha }} ./app

      - name: Scan Trivy (bloque si CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx-app:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push vers Harbor
        run: |
          docker tag nginx-app:${{ github.sha }} localhost:30002/library/nginx-app:${{ github.sha }}
          docker push localhost:30002/library/nginx-app:${{ github.sha }}
